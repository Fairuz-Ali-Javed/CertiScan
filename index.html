<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiScan- Candidate Portal</title>
     <link rel="stylesheet" href="style.css"> 
</head>
<body>

<div class="container">
    <div class="header">
        <h1>CertiScan Verification Portal</h1>
        <p>Please enter your details and upload clear copies of your authentic documents.</p>
    </div>

    <form action="#" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Full Name (As per Documents)</label>
            <input type="text" id="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="roll">Aadhar Number</label>
            <input type="text" id="roll" placeholder="REG1029384" required>
        </div>

        <div class="form-group">
            <label>Upload Documents (PDF, PNG, JPG - Max 2MB)</label>
            <div class="upload-grid">
                <div class="file-box">
                    <strong>10th Marksheet</strong>
                    <input type="file" required>
                </div>
                <div class="file-box">
                    <strong>12th Marksheet</strong>
                    <input type="file" required>
                </div>
                <div class="file-box">
                    <strong>Caste Certificate</strong>
                    <input type="file">
                </div>
                <div class="file-box">
                    <strong>Income Proof</strong>
                    <input type="file">
                </div>
            </div>
        </div>

        <button type="submit" class="submit-btn">Submit for AI Verification</button>
    </form>
</div>

</body>
</html>
